name: CI

on:
  push:
    branches:
      - main
      - kotlin
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build phone and watch
        run: ./gradlew assembleDebug

      # Test builds to try on a device, from the Actions run page. Debug-signed, so they
      # install next to nothing else from the Expo releases; real releases come from tags.
      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: bowels-test-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14
