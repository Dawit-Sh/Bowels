name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Repository secrets: KEYSTORE_BASE64 (the EAS keystore, base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without the EAS key the APK can't update existing installs, so stop instead of shipping one.
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See 'Releases' in the README for how to add the EAS signing key."
            exit 1
          fi

      - name: Restore signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bowels-release.jks
          {
            echo "storeFile=bowels-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APKs
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk bowels-${{ github.ref_name }}.apk
          cp wear/build/outputs/apk/release/wear-release.apk bowels-wear-${{ github.ref_name }}.apk

      # The phone APK goes up first and alone: the 2.x app's update check downloads the
      # first .apk it finds, so the watch APK must never come before it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/RELEASE_TEMPLATE.md
          files: bowels-${{ github.ref_name }}.apk
          draft: false
          prerelease: false

      - name: Attach the watch APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "bowels-wear-${{ github.ref_name }}.apk"
