name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The 2.x app was signed by EAS, and Android only installs updates signed with the same
      # key, so the release key is fetched from Expo with EXPO_TOKEN (pinned to its fingerprint).
      - name: Get the release signing key from Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: python3 .github/scripts/eas_keystore.py write

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APKs
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk bowels-${{ github.ref_name }}.apk
          cp wear/build/outputs/apk/release/wear-release.apk bowels-wear-${{ github.ref_name }}.apk
          rm -f bowels-release.jks keystore.properties

      # Never publish an APK that can't update the installed app.
      - name: Check both APKs carry the 2.x signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          expected=bf81329e7616b0c1074ed627bb2263813e6907c43f14b3ecbb58e70cee6a0004
          for apk in bowels-${{ github.ref_name }}.apk bowels-wear-${{ github.ref_name }}.apk; do
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
            echo "$apk: $actual"
            [ "$actual" = "$expected" ] || { echo "::error::$apk is not signed with the release key."; exit 1; }
          done

      # The phone APK goes up first and alone: the 2.x app's update check downloads the
      # first .apk it finds, so the watch APK must never come before it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/RELEASE_TEMPLATE.md
          files: bowels-${{ github.ref_name }}.apk
          draft: false
          prerelease: false

      - name: Attach the watch APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "bowels-wear-${{ github.ref_name }}.apk"
