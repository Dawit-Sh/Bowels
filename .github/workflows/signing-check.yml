name: Signing check

# Run by hand to confirm the release key is reachable on Expo. Prints fingerprints only.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Look up the EAS keystore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: python3 .github/scripts/eas_keystore.py check
